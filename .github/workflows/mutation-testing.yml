name: Mutation Testing

on:
  schedule:
    # Run nightly at 03:00 UTC (full mutation campaign).
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_TERM_COLOR: always
  # Minimum mutation score (%) to pass the quality gate.
  # Adjust upward as test coverage improves.
  MUTATION_SCORE_MIN: "70"

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package:
          - tarsier-smt
          - tarsier-prob
          - tarsier-engine
          - tarsier-ir

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run mutation testing on critical paths
        # Allow surviving mutants -- the quality gate below enforces the
        # threshold.  We still want to collect results and artifacts even
        # if some mutants survive, so we must not let a non-zero exit
        # code abort the job.
        run: |
          cargo mutants --no-shuffle --timeout=180 -j 2 \
            --output "mutants.${{ matrix.package }}.out" \
            -p "${{ matrix.package }}" \
          || true

      - name: Upload mutation testing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-results-${{ matrix.package }}
          path: mutants.${{ matrix.package }}.out/
          if-no-files-found: error
          retention-days: 30

  mutation-score:
    runs-on: ubuntu-latest
    needs: mutation-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mutation testing results
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-testing-results-*
          path: mutation-results/

      - name: Mutation score quality gate
        run: |
          MUTATION_OUTCOMES_GLOB="mutation-results/**/outcomes.json" \
          MUTATION_EXPECTED_OUTCOME_FILES=4 \
            python3 .github/scripts/check_mutation_score.py
